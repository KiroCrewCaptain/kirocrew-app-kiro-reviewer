<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kiro Reviewer</title>
    <style>
      /* Host palette (hostContext.styles.variables, set by main.mjs) with Kiro Crew fallbacks per theme. */
      :root {
        --bg: var(--color-background-primary, #12141a);
        --elev: var(--color-background-secondary, #1a1d25);
        --hover: var(--color-background-tertiary, #262a35);
        --hl: #ffffff0d;
        --text: var(--color-text-primary, #e4e4e7);
        --strong: var(--color-text-primary, #fafafa);
        --muted: var(--color-text-secondary, #9f9fa8);
        --muted2: var(--color-text-tertiary, #71717a);
        --border: var(--color-border-primary, #27272a);
        --border2: var(--color-border-secondary, #3f3f46);
        --accent: #00d492;
        --accent-fg: #000;
        --accent-hover: #34d399;
        --accent-subtle: #04755833;
        --ok: #22c55e;
        --ok-sub: #22c55e1f;
        --warn: #eab308;
        --warn-sub: #eab3081f;
        --danger: #ef4444;
        --danger-sub: #ef44441f;
        --info: #38bdf8;
        --high: #fb923c;
        --code: #0e1015;
      }
      [data-theme='light'] {
        --bg: var(--color-background-primary, #fafafa);
        --elev: var(--color-background-secondary, #fff);
        --hover: var(--color-background-tertiary, #f0f0f0);
        --hl: #00000008;
        --text: var(--color-text-primary, #3f3f46);
        --strong: var(--color-text-primary, #18181b);
        --muted: var(--color-text-secondary, #71717a);
        --muted2: var(--color-text-tertiary, #a1a1aa);
        --border: var(--color-border-primary, #e4e4e7);
        --border2: var(--color-border-secondary, #d4d4d8);
        --accent: #047558;
        --accent-fg: #fff;
        --accent-hover: #059669;
        --accent-subtle: #0475581f;
        --ok: #16a34a;
        --ok-sub: #16a34a1a;
        --warn: #a16207;
        --warn-sub: #a162071a;
        --danger: #dc2626;
        --danger-sub: #dc26261a;
        --info: #0891b2;
        --high: #ea580c;
        --code: #f4f4f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .mono,
      .loc,
      .code {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #root {
        padding: 12px 14px 12px;
      }
      .muted {
        color: var(--muted);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .pad {
        padding: 8px 0;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .title {
        font-weight: 600;
        color: var(--strong);
        font-size: 14px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--muted);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.bad {
        background: var(--danger);
      }
      .dot.run {
        background: var(--accent);
        animation: p 1.4s ease-in-out infinite;
      }
      @keyframes p {
        50% {
          opacity: 0.35;
        }
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 0 0 15px;
      }
      .stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin: 12px 0 8px;
      }
      .stat b {
        font-weight: 600;
        color: var(--strong);
        font-size: 15px;
        margin-right: 5px;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        color: var(--muted);
        font-size: 12px;
      }
      .stat.crit b {
        color: var(--danger);
      }
      .stat.okc b {
        color: var(--ok);
      }
      .bar {
        display: flex;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--hover);
        margin: 0 0 10px;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      .c-critical {
        background: var(--danger);
      }
      .c-high {
        background: var(--high);
      }
      .c-medium {
        background: var(--warn);
      }
      .c-low {
        background: var(--info);
      }
      .c-nit {
        background: var(--muted2);
      }
      .t-critical {
        color: var(--danger);
      }
      .t-high {
        color: var(--high);
      }
      .t-medium {
        color: var(--warn);
      }
      .t-low {
        color: var(--info);
      }
      .t-nit {
        color: var(--muted);
      }
      .delta {
        color: var(--muted);
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .delta b {
        color: var(--strong);
        font-weight: 600;
      }
      .list {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--elev);
      }
      .row {
        border-top: 1px solid var(--border);
      }
      .row:first-child {
        border-top: 0;
      }
      .row > summary {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 10px;
        cursor: pointer;
        list-style: none;
      }
      .row > summary::-webkit-details-marker {
        display: none;
      }
      .row > summary:hover {
        background: var(--hl);
      }
      .row[open] > summary {
        background: var(--hl);
      }
      .sev {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        width: 72px;
        font-size: 12px;
        font-weight: 500;
      }
      .sev .dot {
        width: 6px;
        height: 6px;
      }
      .ft {
        color: var(--strong);
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .where {
        font:
          11px 'JetBrains Mono',
          ui-monospace,
          monospace;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      .chev {
        color: var(--muted2);
        font-size: 11px;
        transition: transform 0.15s;
      }
      .row[open] .chev {
        transform: rotate(90deg);
      }
      .fb {
        padding: 2px 12px 12px 92px;
      }
      .loc {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .prose {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 6px 0;
      }
      .h {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 8px;
      }
      .code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.5;
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 4px 0;
      }
      .note {
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--warn-sub);
        color: var(--text);
        font-size: 12px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        padding: 1px 7px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 500;
        background: var(--hover);
        color: var(--muted);
        white-space: nowrap;
      }
      .tag.block {
        background: var(--danger-sub);
        color: var(--danger);
      }
      .tag.new {
        background: var(--accent-subtle);
        color: var(--accent);
      }
      .row.sup > summary {
        cursor: default;
        opacity: 0.6;
      }
      .row.sup .ft {
        font-weight: 400;
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--muted2);
      }
      .why {
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .more {
        margin: 6px 2px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      button:hover {
        background: var(--hover);
        border-color: var(--border2);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 500;
      }
      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .kv {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 4px 12px;
        margin: 10px 0;
        font-size: 12px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--text);
      }
      .callout {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--accent-subtle);
        font-size: 12px;
      }
      .callout b {
        color: var(--strong);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="muted pad">Loading…</div></div>
    <script>
      /*CARD_SCRIPT*/
    </script>
  </body>
</html>
