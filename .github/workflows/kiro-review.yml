name: Kiro Reviewer
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/kiro-review' ||
        startsWith(github.event.comment.body, '/kiro-review ') ||
        startsWith(github.event.comment.body, format('/kiro-review{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/kiro-review{0}', fromJSON('"\r"')))))
    concurrency:
      group: kiro-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # For /kiro-review comments `ref` is empty and the default branch is checked out. The action
      # reads the PR from the API, skips fork PRs and fetches refs/pull/<n>/head itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: kirodotdev/kiro-reviewer-action@d3d3b80dd9738069f026e8816c84322c4830119b
        with:
          kiro-api-key: ${{ secrets.KIRO_API_KEY }}
